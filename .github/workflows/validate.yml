name: validate

# Keeps the repo honest without a human re-reading it. Nine cheap checks:
#   1. every relative markdown link resolves
#   2. every YAML file parses
#   3. every azure.yaml `project:` path actually exists on disk
#   4. every tutorial lab carries the lab skeleton (metadata, checkpoint, next)
#   5. no doc page is orphaned — everything is reachable from README.md
#   6. eval assets live in the service `project:` dir, not the sample root
#   7. version claims agree with the canonical table in docs/reference/README.md
#   8. the three-layer contract: learn/ teaches, tutorial/ is hands-on, reference/ is lookup
#   9. every #anchor in a relative link matches a real heading
# (3) caught a shipped-broken C# sample. (6) caught an unrunnable eval sample.
# (7) exists because a preview version number appearing in 14 files is 14 places to drift.
# (8) is AGENTS.md's "respect the layer" rule made executable: a command the reader types
#     must not appear in learn/, and a lab with nothing to type is a learn page misfiled.
# (9) caught 59 anchors left dangling by the Phase-2 split: the file still resolved, so
#     check (1) stayed green while the reader silently landed at the top of the page.
# Structure that isn't enforced decays.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Check relative markdown links
        run: |
          python - <<'PY'
          import glob, os, re, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              d = os.path.dirname(f)
              for m in re.finditer(r'\[[^\]]*\]\(([^)#][^)]*)\)', open(f).read()):
                  t = m.group(1).split('#')[0].strip()
                  if not t or t.startswith(('http', 'mailto')):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(d, t))):
                      bad.append(f"{f} -> {t}")
          for b in bad:
              print(f"::error::broken link {b}")
          print(f"{len(bad)} broken relative link(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Check YAML parses
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in glob.glob('**/*.y*ml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          for b in bad:
              print(f"::error::invalid YAML {b}")
          print(f"{len(bad)} invalid YAML file(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Check azure.yaml service paths resolve
        run: |
          python - <<'PY'
          import glob, os, sys, yaml
          bad = []
          for f in glob.glob('samples/**/azure.yaml', recursive=True):
              root = os.path.dirname(f)
              doc = yaml.safe_load(open(f)) or {}
              for name, svc in (doc.get('services') or {}).items():
                  p = (svc or {}).get('project')
                  if p and not os.path.isdir(os.path.join(root, p)):
                      bad.append(f"{f}: service '{name}' project '{p}' does not exist")
          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} unresolved service path(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Check tutorial labs carry the lab skeleton
        run: |
          python - <<'PY'
          import glob, os, re, sys
          bad = []
          for f in sorted(glob.glob('docs/tutorial/*.md')):
              base = os.path.basename(f)
              if base == 'README.md':
                  continue
              t = open(f).read()
              if not re.search(r'^> ⏱️ \*\*', t, re.M):
                  bad.append(f"{f}: missing '> ⏱️ **<time>**' metadata line")
              if '## ✅ Checkpoint' not in t:
                  bad.append(f"{f}: missing '## ✅ Checkpoint'")
              if '## → Next' not in t:
                  bad.append(f"{f}: missing '## → Next'")
              if '## 🔧 If that didn' not in t:
                  bad.append(f"{f}: missing '## 🔧 If that didn't work'")
          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} lab-structure problem(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Check no doc page is orphaned
        run: |
          python - <<'PY'
          import glob, os, re, sys
          pages = {os.path.normpath(f) for f in glob.glob('docs/**/*.md', recursive=True)}
          linked, seen = set(), set()
          queue = ['README.md']
          while queue:
              f = queue.pop()
              if f in seen or not os.path.exists(f):
                  continue
              seen.add(f)
              d = os.path.dirname(f)
              for m in re.finditer(r'\[[^\]]*\]\(([^)#][^)]*)\)', open(f).read()):
                  t = m.group(1).split('#')[0].strip()
                  if not t or t.startswith(('http', 'mailto')):
                      continue
                  p = os.path.normpath(os.path.join(d, t))
                  if os.path.isdir(p):
                      p = os.path.join(p, 'README.md')
                  if p.endswith('.md'):
                      linked.add(p)
                      queue.append(p)
          orphans = sorted(pages - linked)
          for o in orphans:
              print(f"::error::orphan page (unreachable from README.md): {o}")
          print(f"{len(orphans)} orphan page(s)")
          sys.exit(1 if orphans else 0)
          PY

      - name: Check eval assets live in the service project dir
        run: |
          python - <<'PY'
          import glob, os, sys, yaml
          # Verified 2026-08-09: `azd ai agent eval` resolves eval.yaml and every
          # local_uri against the service `project:` dir, never the sample root.
          bad = []
          for f in glob.glob('samples/**/azure.yaml', recursive=True):
              root = os.path.dirname(f)
              if os.path.exists(os.path.join(root, 'eval.yaml')):
                  bad.append(f"{root}: eval.yaml is in the sample root; it must live in the service project dir")
              doc = yaml.safe_load(open(f)) or {}
              for name, svc in (doc.get('services') or {}).items():
                  proj = (svc or {}).get('project')
                  if not proj:
                      continue
                  ev = os.path.join(root, proj, 'eval.yaml')
                  if not os.path.exists(ev):
                      continue
                  e = yaml.safe_load(open(ev)) or {}
                  base = os.path.join(root, proj)
                  ds = (e.get('dataset') or {}).get('local_uri')
                  if ds and not os.path.exists(os.path.join(base, ds)):
                      bad.append(f"{ev}: dataset local_uri '{ds}' does not resolve under {proj}")
                  for ev_item in (e.get('evaluators') or []):
                      u = (ev_item or {}).get('local_uri')
                      if u and not os.path.exists(os.path.join(base, u)):
                          bad.append(f"{ev}: evaluator local_uri '{u}' does not resolve under {proj}")
          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} eval-layout problem(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Check version claims agree with the canonical table
        run: |
          python - <<'PY'
          import glob, re, sys
          # docs/reference/README.md "Fast facts" is the single source of truth for versions.
          # Any other page that states a version for these must state the SAME one.
          canon = open('docs/reference/README.md').read()
          pinned = {}
          m = re.search(r'Minimum `azd` \| \*\*([0-9.]+)\*\*', canon)
          if m:
              pinned['azd-floor'] = m.group(1)
          for ext in ('azure.ai.agents', 'azure.ai.connections', 'azure.ai.inspector',
                      'azure.ai.projects', 'azure.ai.toolboxes'):
              m = re.search(re.escape('`' + ext + '` `') + r'([0-9][0-9A-Za-z.\-]*)`', canon)
              if m:
                  pinned[ext] = m.group(1)
          if not pinned:
              print('::error::could not parse the canonical version table')
              sys.exit(1)
          print('canonical:', pinned)

          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              if f == 'docs/reference/README.md':
                  continue
              text = open(f).read()
              for i, line in enumerate(text.splitlines(), 1):
                  # Skip lines that are deliberately quoting an OLD version to explain a failure.
                  if 'incompatible' in line or 'installing' in line or 'downgrad' in line:
                      continue
                  for ext, want in pinned.items():
                      if ext == 'azd-floor':
                          continue
                      for found in re.findall(re.escape(ext) + r'[` ]+`?([0-9][0-9A-Za-z.\-]*)`?', line):
                          if found != want:
                              bad.append(f"{f}:{i}: {ext} stated as '{found}', canonical is '{want}'")
          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} version-drift problem(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Check the three-layer contract holds
        run: |
          python - <<'PY'
          import glob, os, re, sys

          # The three-mode contract, enforced.
          #   learn/    = 読む — understanding only. A command the reader types belongs in tutorial/.
          #   tutorial/ = 手を動かす — a lab that never asks you to type anything is a learn page
          #               filed in the wrong directory.
          # Structure that isn't enforced decays; this is the rule AGENTS.md calls "respect the layer".

          SHELL_LANGS = {'bash', 'sh', 'shell', 'console', 'zsh', 'powershell', 'pwsh', 'ps1', 'cmd', 'bat'}
          CMD_START = re.compile(r'^\s*(?:\$\s+)?(azd|az|pip|pip3|python|python3|dotnet|docker|npm|npx|curl|git|winget|brew|apt|choco)\b')

          bad = []


          def fences(text):
              """Yield (lang, start_line, [lines]) for every fenced block."""
              out, lang, buf, start = [], None, [], 0
              for i, line in enumerate(text.splitlines(), 1):
                  m = re.match(r'^\s*```+\s*([A-Za-z0-9_+-]*)\s*$', line)
                  if m:
                      if lang is None:
                          lang, buf, start = m.group(1).lower(), [], i
                      else:
                          out.append((lang, start, buf))
                          lang = None
                  elif lang is not None:
                      buf.append((i, line))
              return out


          # ---- learn/ must contain no command the reader types -------------------------
          for f in sorted(glob.glob('docs/learn/*.md')):
              text = open(f).read()
              for lang, start, body in fences(text):
                  if lang in SHELL_LANGS:
                      bad.append(f"{f}:{start}: '```{lang}' fence in the learn layer — "
                                 f"move the command to docs/tutorial/ and link to it")
                      continue
                  for ln, line in body:
                      if CMD_START.match(line):
                          bad.append(f"{f}:{ln}: reader-typed command in the learn layer -> {line.strip()!r}")

          # ---- every learn page carries active recall and an exit ----------------------
          for f in sorted(glob.glob('docs/learn/*.md')):
              base = os.path.basename(f)
              text = open(f).read()
              if base == 'README.md':
                  continue
              if '## ✅ Check your understanding' not in text:
                  bad.append(f"{f}: missing '## ✅ Check your understanding' — the learn layer is "
                             f"passive without it")
              elif text.find('## ✅ Check your understanding') > text.find('## → Next'):
                  bad.append(f"{f}: '## ✅ Check your understanding' must come before '## → Next'")
              if '## → Next' not in text:
                  bad.append(f"{f}: missing '## → Next'")
              if not re.search(r'^<sub>', text, re.M):
                  bad.append(f"{f}: missing the prev/next footer")

          # ---- tutorial/ must actually be hands-on ------------------------------------
          for f in sorted(glob.glob('docs/tutorial/*.md')):
              if os.path.basename(f) == 'README.md':
                  continue
              text = open(f).read()
              if not any(lang in SHELL_LANGS for lang, _, _ in fences(text)):
                  bad.append(f"{f}: no shell fence — a lab with nothing to type belongs in docs/learn/")

          # ---- reference/ is lookup, not a lab ----------------------------------------
          for f in sorted(glob.glob('docs/reference/*.md')):
              text = open(f).read()
              for marker in ('## ✅ Checkpoint', '## ✏️ Exercise'):
                  if marker in text:
                      bad.append(f"{f}: '{marker}' belongs to the tutorial layer, not reference")

          for b in bad:
              print(f"::error::{b}")
          print(f"{len(bad)} layer-contract problem(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: Check heading anchors resolve
        run: |
          python - <<'PY'
          import glob, os, re, sys

          # Relative links are already checked; this checks the #fragment half of them.
          # The Phase-2 restructure split one concepts page into ten, and every anchor that
          # pointed into the old page kept resolving as a file while silently landing at the
          # top. A link that lands in the wrong place is worse than one that 404s.

          SLUG = re.compile(r'[^\w\- ]', re.U)


          def anchors(path):
              """GitHub's heading-slug algorithm: lowercase, drop punctuation, spaces -> hyphens."""
              out, in_fence = set(), False
              for line in open(path, encoding='utf-8'):
                  if line.lstrip().startswith('```'):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  m = re.match(r'^#{1,6}\s+(.*?)\s*$', line)
                  if not m:
                      continue
                  s = SLUG.sub('', m.group(1).lower()).rstrip()
                  base = s.replace(' ', '-')
                  slug, n = base, 1
                  while slug in out:
                      slug, n = f"{base}-{n}", n + 1
                  out.add(slug)
              return out


          cache, bad = {}, []
          for f in sorted(glob.glob('**/*.md', recursive=True)):
              d = os.path.dirname(f)
              text = open(f, encoding='utf-8').read()
              for m in re.finditer(r'\[[^\]]*\]\(([^)\s]*#[^)\s]+)\)', text):
                  tgt = m.group(1)
                  if tgt.startswith(('http', 'mailto')):
                      continue
                  path, frag = tgt.split('#', 1)
                  p = os.path.normpath(os.path.join(d, path)) if path else f
                  if os.path.isdir(p):
                      p = os.path.join(p, 'README.md')
                  if not os.path.exists(p):
                      continue  # the link checker already owns missing files
                  if p not in cache:
                      cache[p] = anchors(p)
                  if frag not in cache[p]:
                      bad.append(f"{f}: '#{frag}' does not exist in {p}")

          for b in bad:
              print(f"::error::broken anchor {b}")
          print(f"{len(bad)} broken anchor(s)")
          sys.exit(1 if bad else 0)
          PY
